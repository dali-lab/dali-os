services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dali
      POSTGRES_PASSWORD: dali
      POSTGRES_DB: dali
    volumes:
      - pgdata:/var/lib/postgresql/data
      # `prisma db push --force-reset` (api service) skips the migrations
      # folder, so the `CREATE EXTENSION` statements that live in migrations
      # never run against this DB. Postgres runs anything in this directory
      # once, when the data directory is first initialised, which is the
      # right place to declare dev-env extensions the schema depends on.
      - ./dali-api/prisma/docker-init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dali -d dali"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./dali-api
      target: deps
    command: sh -c "npx prisma generate && npx prisma db push --force-reset && npx prisma db seed && npm run dev & npx prisma studio --port 5555 --browser none & wait"
    working_dir: /app
    ports:
      - "3001:3001"
      - "3002:3002"
      - "5555:5555"
    volumes:
      - ./dali-api:/app
      - api_node_modules:/app/node_modules
    # Compose only reads repo-root .env for ${VAR} substitution; this loads dali-api/.env into the container.
    env_file:
      - ./dali-api/.env
    environment:
      DATABASE_URL: postgresql://dali:dali@db:5432/dali
      CAS_BASE_URL: https://login.dartmouth.edu/cas
      FRONTEND_URL: http://localhost:5173
      API_BASE_URL: http://localhost:3001
      COLLAB_PORT: 3002
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  api_node_modules:
