name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PROJECT_ID: falling-morning-15858013
  PARENT_BRANCH_NAME: development
  FLY_ORG_OVERRIDE: ${{ vars.FLY_ORG }}
  FLY_ORG_REFERENCE_APP: dali-api-staging

jobs:
  prep-neon-db:
    name: Prepare Neon branch (preview-pr-${{ github.event.pull_request.number }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      branch_id: ${{ steps.connect.outputs.branch_id }}
    steps:
      - name: Find or create Neon branch, then wipe schema
        id: connect
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          BRANCH_NAME="preview-pr-$PR"
          API="https://console.neon.tech/api/v2/projects/$PROJECT_ID"

          BRANCHES=$(curl -sf "$API/branches" \
            -H "Authorization: Bearer $NEON_API_KEY")

          PARENT_ID=$(echo "$BRANCHES" | jq -r \
            --arg n "$PARENT_BRANCH_NAME" \
            '.branches[] | select(.name==$n) | .id')
          if [ -z "$PARENT_ID" ] || [ "$PARENT_ID" = "null" ]; then
            echo "parent branch '$PARENT_BRANCH_NAME' not found in Neon project" >&2
            exit 1
          fi

          BRANCH_ID=$(echo "$BRANCHES" | jq -r \
            --arg n "$BRANCH_NAME" \
            '.branches[] | select(.name==$n) | .id')

          if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" = "null" ]; then
            echo "Creating new Neon branch $BRANCH_NAME off $PARENT_BRANCH_NAME"
            CREATE_RES=$(curl -sf -X POST "$API/branches" \
              -H "Authorization: Bearer $NEON_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg name "$BRANCH_NAME" \
                --arg parent "$PARENT_ID" \
                '{branch: {name: $name, parent_id: $parent}, endpoints: [{type: "read_write"}]}')")
            BRANCH_ID=$(echo "$CREATE_RES" | jq -r '.branch.id')
          else
            echo "Reusing existing Neon branch $BRANCH_NAME ($BRANCH_ID)"
            ENDPOINTS=$(curl -sf "$API/branches/$BRANCH_ID/endpoints" \
              -H "Authorization: Bearer $NEON_API_KEY")
            EP_COUNT=$(echo "$ENDPOINTS" | jq -r '.endpoints | length')
            if [ "$EP_COUNT" = "0" ]; then
              echo "No endpoint on branch — creating one"
              curl -sf -X POST "$API/endpoints" \
                -H "Authorization: Bearer $NEON_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$(jq -n \
                  --arg branch "$BRANCH_ID" \
                  '{endpoint: {branch_id: $branch, type: "read_write"}}')" >/dev/null
            fi
          fi

          URI_RES=$(curl -sf -G "$API/connection_uri" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            --data-urlencode "branch_id=$BRANCH_ID" \
            --data-urlencode "database_name=neondb" \
            --data-urlencode "role_name=neondb_owner")
          DATABASE_URL=$(echo "$URI_RES" | jq -r '.uri')
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "null" ]; then
            echo "failed to fetch connection_uri" >&2
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

          # Emit only the branch_id (non-secret). The deploy-api job re-fetches
          # the connection URI itself — GitHub's output sanitizer strips
          # secret-like values across jobs even when base64-encoded.
          echo "branch_id=$BRANCH_ID" >>"$GITHUB_OUTPUT"

  deploy-api:
    name: Deploy API (dali-api-pr-${{ github.event.pull_request.number }})
    needs: [prep-neon-db]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      url: ${{ steps.urls.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Compute preview identifiers
        id: urls
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          APP="dali-api-pr-$PR"
          URL="https://$APP.fly.dev"
          echo "app=$APP" >>"$GITHUB_OUTPUT"
          echo "url=$URL" >>"$GITHUB_OUTPUT"

      - name: Resolve Fly org
        id: fly-org
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          ORG="${FLY_ORG_OVERRIDE:-}"
          if [ -z "$ORG" ]; then
            ORG=$(flyctl apps list --json \
              | jq -r --arg app "$FLY_ORG_REFERENCE_APP" \
                  '.[] | select((.Name // .name) == $app)
                       | (.Organization.Slug // .organization.slug // empty)')
          fi
          if [ -z "$ORG" ] || [ "$ORG" = "null" ]; then
            echo "Could not resolve Fly org (checked vars.FLY_ORG and $FLY_ORG_REFERENCE_APP)" >&2
            exit 1
          fi
          echo "Using Fly org: $ORG"
          echo "org=$ORG" >>"$GITHUB_OUTPUT"

      - name: Ensure Fly app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.urls.outputs.app }}
          ORG: ${{ steps.fly-org.outputs.org }}
        run: |
          set -euo pipefail

          # Validate the app is usable, not just that it exists.
          # flyctl apps show can return 0 for zombie apps that are stuck
          # in a broken state after a partial teardown. flyctl status
          # exercises the full appcompact query that secrets/deploy use,
          # so if it fails the app is unusable.
          if flyctl status -a "$APP" >/dev/null 2>&1; then
            echo "App $APP exists and is queryable — continuing"
          else
            # Destroy any zombie remnant (ignore errors if it doesn't exist)
            flyctl apps destroy "$APP" --yes 2>/dev/null || true
            flyctl apps create "$APP" --org "$ORG"
          fi

      - name: Set Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          APP: ${{ steps.urls.outputs.app }}
          URL: ${{ steps.urls.outputs.url }}
          BRANCH_ID: ${{ needs.prep-neon-db.outputs.branch_id }}
        run: |
          set -euo pipefail
          if [ -z "$BRANCH_ID" ]; then
            echo "branch_id from prep-neon-db is empty — refusing to deploy" >&2
            exit 1
          fi

          API="https://console.neon.tech/api/v2/projects/$PROJECT_ID"
          # pooled=false: prisma migrate deploy acquires pg_advisory_lock,
          # which is session-scoped and unreliable through Neon's pooler
          # (PgBouncer-style transaction pooling reuses backend sessions).
          # See issue #101 for longer-term investigation across deploy paths.
          URI_RES=$(curl -sf -G "$API/connection_uri" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            --data-urlencode "branch_id=$BRANCH_ID" \
            --data-urlencode "database_name=neondb" \
            --data-urlencode "role_name=neondb_owner" \
            --data-urlencode "pooled=false")
          DATABASE_URL=$(echo "$URI_RES" | jq -r '.uri')
          if [ -z "$DATABASE_URL" ] || [ "$DATABASE_URL" = "null" ]; then
            echo "failed to fetch connection_uri for $BRANCH_ID" >&2
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"

          # Preview JWT is per-deploy: the DB is wiped on every push, so
          # stability across deploys doesn't matter. Keeps us from depending
          # on a PREVIEW_JWT_SECRET repo secret that isn't set.
          JWT_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET"

          # Fly's API is eventually consistent — the app may not be
          # queryable immediately after creation. Retry up to 4 times
          # with exponential backoff.
          n=0
          until flyctl secrets set -a "$APP" --stage \
            DATABASE_URL="$DATABASE_URL" \
            NODE_ENV=development \
            JWT_SECRET="$JWT_SECRET" \
            API_BASE_URL="$URL" \
            GOOGLE_CLIENT_ID="preview-placeholder.apps.googleusercontent.com" \
            CAS_BASE_URL="https://login.dartmouth.edu/cas" \
            AWS_REGION="us-east-1" \
            AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            AWS_S3_BUCKET="dali-os-uploads-dev"
          do
            n=$((n+1))
            if [ $n -ge 4 ]; then
              echo "flyctl secrets set failed after $n attempts" >&2
              exit 1
            fi
            echo "flyctl secrets set failed (attempt $n/4) — retrying in ${n}s..."
            sleep $n
          done

      - name: Allocate public IPs (idempotent)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.urls.outputs.app }}
        run: |
          flyctl ips allocate-v4 --shared -a "$APP" 2>&1 || true
          flyctl ips allocate-v6 -a "$APP" 2>&1 || true

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.urls.outputs.app }}
        run: |
          cd ./dali-api
          flyctl deploy --config fly.preview.toml -a "$APP" \
            --ha=false --strategy immediate --wait-timeout 600 --verbose

      - name: Dump release diagnostics on failure
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.urls.outputs.app }}
        run: |
          set +e
          if ! flyctl apps show "$APP" >/dev/null 2>&1; then
            echo "App $APP does not exist — skipping diagnostics"
            exit 0
          fi
          echo "=== releases list ==="
          flyctl releases -a "$APP"
          echo "=== machines list ==="
          flyctl machines list -a "$APP"
          echo "=== recent logs (no-tail) ==="
          flyctl logs -a "$APP" --no-tail

  comment-on-pr:
    name: Comment preview URL on PR
    needs: [deploy-api]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      pull-requests: write
    steps:
      - name: Find existing preview comment
        id: find
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- preview-deploy -->

      - name: Upsert preview comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- preview-deploy -->
            **Preview API deployed** — ${{ needs.deploy-api.outputs.url }}

            - Pick a seeded user at [`/dev-login`](${{ needs.deploy-api.outputs.url }}/dev-login).
            - Database is a Neon branch `preview-pr-${{ github.event.pull_request.number }}` (reset + reseeded on every push).
            - Torn down automatically when this PR closes.

  pagespeed:
    name: PageSpeed Insights
    needs: [deploy-api]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      pull-requests: write
    env:
      PREVIEW_URL: ${{ needs.deploy-api.outputs.url }}
      # PSI runs from Google's infrastructure and cannot authenticate, but
      # previews run NODE_ENV=development so /dev-login-as is live: PSI's
      # browser picks up the session cookie on the 302 and what actually gets
      # measured is the authenticated member Home. The admin seed user is the
      # most stable seed row and renders the fullest nav/widget surface.
      AUTH_LOGIN_PATH: "/dev-login-as?daliEmail=admin@dali.dartmouth.edu&redirect=/"
      # Report-only by default. Set to 1-100 to fail this check when the
      # authenticated Home *mobile* performance score drops below it.
      MIN_PERF_SCORE: "0"
      # Effectively required: keyless PSI requests are rate-limited (429)
      # from datacenter IPs. Without the secret the job no-ops with a notice.
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
    steps:
      - name: Check for API key
        id: precheck
        run: |
          if [ -z "$PAGESPEED_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo '### PageSpeed Insights — skipped'
              echo
              echo 'The `PAGESPEED_API_KEY` repo secret is not set, and keyless PSI requests get rate-limited from CI. Create an API key in Google Cloud (enable the "PageSpeed Insights API", free) and add it as a repo secret to activate this check.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Warm up preview app
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          n=0
          until curl -sfo /dev/null --max-time 30 "$PREVIEW_URL/login"; do
            n=$((n+1))
            if [ $n -ge 10 ]; then
              echo "preview app never became reachable at $PREVIEW_URL" >&2
              exit 1
            fi
            echo "waiting for preview app (attempt $n/10)..."
            sleep $((n*5))
          done
          # Warm the authenticated Home loaders too (the cookie jar carries
          # the dev-login session through the redirect) so PSI doesn't measure
          # a cold Fly machine (min_machines_running = 0) or cold Neon compute.
          curl -sfL -c /tmp/psi-cookies -o /dev/null --max-time 60 \
            "$PREVIEW_URL$AUTH_LOGIN_PATH"

      - name: Run PageSpeed Insights
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          run_psi() {
            local strategy="$1" target="$2" out="$3" n=0
            local args=( -sSf -G --max-time 180
              --data-urlencode "url=$target"
              --data-urlencode "strategy=$strategy"
              --data-urlencode "category=performance"
              --data-urlencode "category=accessibility"
              --data-urlencode "category=best-practices" )
            if [ -n "${PAGESPEED_API_KEY:-}" ]; then
              args+=( --data-urlencode "key=$PAGESPEED_API_KEY" )
            fi
            until curl "${args[@]}" -o "$out" \
                "https://www.googleapis.com/pagespeedonline/v5/runPagespeed"; do
              n=$((n+1))
              if [ $n -ge 3 ]; then
                echo "PSI $strategy for $target failed after 3 attempts" >&2
                return 1
              fi
              echo "PSI $strategy attempt $n failed — retrying in $((n*15))s"
              sleep $((n*15))
            done
          }
          for strategy in mobile desktop; do
            run_psi "$strategy" "$PREVIEW_URL$AUTH_LOGIN_PATH" "psi-home-$strategy.json"
            run_psi "$strategy" "$PREVIEW_URL/login" "psi-login-$strategy.json"
          done

      - name: Build report
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # If the dev-login redirect ever breaks, PSI silently measures the
          # login page instead of Home — fail loudly rather than report wrong
          # numbers under the Home label.
          FINAL=$(jq -r '.lighthouseResult.finalDisplayedUrl // .lighthouseResult.finalUrl // ""' psi-home-mobile.json)
          case "$FINAL" in
            */login*) echo "dev-login redirect broke: Home run landed on $FINAL" >&2; exit 1 ;;
          esac

          score() {
            jq -r --arg c "$2" \
              '.lighthouseResult.categories[$c].score as $s
               | if $s == null then "–" else ($s*100 | round | tostring) end' "$1"
          }
          metric() {
            jq -r --arg a "$2" '.lighthouseResult.audits[$a].displayValue // "–"' "$1"
          }
          row() {
            local label="$1" strategy="$2" f="psi-$1-$2.json"
            echo "| $label | $strategy | $(score "$f" performance) | $(score "$f" accessibility) | $(score "$f" best-practices) | $(metric "$f" largest-contentful-paint) | $(metric "$f" total-blocking-time) | $(metric "$f" cumulative-layout-shift) |"
          }

          {
            echo '<!-- pagespeed-insights -->'
            echo '### PageSpeed Insights'
            echo
            echo '| Page | Strategy | Perf | A11y | Best practices | LCP | TBT | CLS |'
            echo '|---|---|---|---|---|---|---|---|'
            row home mobile
            row home desktop
            row login mobile
            row login desktop
            echo
            echo "\`home\` is the authenticated member Home (admin seed user via \`/dev-login-as\`, includes one constant redirect hop). Preview VM is shared-cpu-1x/1GB — compare scores across PRs, not against prod."
          } > psi-report.md
          cat psi-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing PageSpeed comment
        if: steps.precheck.outputs.skip != 'true'
        id: find
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- pagespeed-insights -->

      - name: Upsert PageSpeed comment
        if: steps.precheck.outputs.skip != 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: psi-report.md

      - name: Enforce performance threshold
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if [ "$MIN_PERF_SCORE" -le 0 ]; then
            echo "Report-only mode (MIN_PERF_SCORE=$MIN_PERF_SCORE) — not gating."
            exit 0
          fi
          PERF=$(jq -r '.lighthouseResult.categories.performance.score // 0 | .*100 | round' psi-home-mobile.json)
          echo "Authenticated Home mobile performance score: $PERF (threshold: $MIN_PERF_SCORE)"
          if [ "$PERF" -lt "$MIN_PERF_SCORE" ]; then
            echo "Performance score $PERF is below MIN_PERF_SCORE=$MIN_PERF_SCORE" >&2
            exit 1
          fi
