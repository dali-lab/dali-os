name: Migration Safety Check

on:
  pull_request:

jobs:
  migration-check:
    name: Check migrations
    runs-on: blacksmith-2vcpu-ubuntu-2404

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma_shadow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: dali-api

      - name: Check for unmigrated schema changes
        run: |
          cd dali-api
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: "postgresql://prisma:prisma@localhost:5432/prisma_shadow"
          SHADOW_DATABASE_URL: "postgresql://prisma:prisma@localhost:5432/prisma_shadow"

      - name: Check for deleted migration files
        run: |
          DELETED=$(git diff --name-only --diff-filter=D origin/${{ github.base_ref }}...HEAD -- 'dali-api/prisma/migrations/')
          if [ -n "$DELETED" ]; then
            echo "Error: migration files must never be deleted:"
            echo "$DELETED"
            exit 1
          fi

      - name: Check migration safety
        # Analyze only the migrations this PR adds or edits, not the whole
        # history. Applied migrations are immutable (never hand-edited), so a
        # finding on one is unactionable — and re-scanning them means a stricter
        # analyzer release can fail PRs that touch no migrations at all. That is
        # exactly how pgfence 0.8.0 (DROP TABLE reclassified CRITICAL) broke
        # every branch. Mirrors the diff-based deleted-file check above. pgfence
        # is also pinned so an analyzer release can't change a verdict
        # mid-review; bump it deliberately.
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM \
            "origin/${{ github.base_ref }}...HEAD" \
            -- 'dali-api/prisma/migrations/' | grep '\.sql$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No migration changes in this PR — skipping safety analysis."
            exit 0
          fi
          echo "Analyzing changed migrations:"
          echo "$CHANGED"
          npx @flvmnt/pgfence@0.7.0 analyze --ci --max-risk high \
            --no-lock-timeout --no-statement-timeout $CHANGED
