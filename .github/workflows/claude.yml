name: Claude

# Claude-in-the-loop workflow:
#   1. Add the `claude` label to an issue -> Claude posts an implementation plan.
#   2. Reply with @claude to refine the plan in-thread.
#   3. Comment `/implement` on the issue to approve -> Claude opens a PR.
#   4. When a review or review comment is left on a Claude-owned PR, Claude
#      addresses it or leaves a comment explaining why it can't.
#
# CI auto-fix lives in claude-ci-fix.yml (separate because it debounces on
# check-run completion across the whole PR head SHA).
#
# Auth: uses CLAUDE_CODE_OAUTH_TOKEN minted via `claude setup-token` from a
# personal Claude Max subscription. No ANTHROPIC_API_KEY.
#
# Safety note: we deliberately do NOT interpolate user-authored free-text
# (issue body, comment body, review body, issue title) directly into the
# prompt YAML. Instead we hand Claude the issue/PR number and let it fetch
# content via `gh`. This avoids both YAML-string corruption from exotic
# chars and giving attackers a direct line into the prompt via issue text.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: >
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You have been assigned issue #${{ github.event.issue.number }} in
            ${{ github.repository }} via the `claude` label.

            Step 1 — read context:
              - Read `CLAUDE.md` at the repo root.
              - Run `gh issue view ${{ github.event.issue.number }} --json title,body,labels,comments`
                to read the issue title, body, and any existing discussion.
              - Read any source files relevant to what the issue asks for.

            Step 2 — post exactly ONE comment on issue #${{ github.event.issue.number }}
            containing an implementation plan:
              - Short context paragraph (restate the problem in your own words).
              - Bulleted list of concrete steps.
              - Files you expect to add or modify (with paths).
              - Any assumptions, open questions, or tradeoffs.
              - End with: "Reply with @claude to refine. Comment `/implement` to approve and have me open a PR."

            Rules:
              - Do NOT open a PR, push a branch, or modify any files. Comment only.
              - Do NOT modify `.github/workflows/*`.
          claude_args: --model opus --max-turns 100 --allowedTools "Read,Glob,Grep,LS,Bash(gh:*)"
      - name: Mark issue claude-plan-needs-review
        if: success()
        uses: ./.github/actions/set-claude-label
        with:
          issue: ${{ github.event.issue.number }}
          label: claude-plan-needs-review
          github-token: ${{ secrets.GITHUB_TOKEN }}

  refine:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      !startsWith(github.event.comment.body, '/implement') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A collaborator (@${{ github.event.comment.user.login }}) has replied to your
            plan on issue #${{ github.event.issue.number }}. Their comment URL is
            ${{ github.event.comment.html_url }}.

            Step 1 — read context:
              - Read `CLAUDE.md`.
              - Run `gh issue view ${{ github.event.issue.number }} --json title,body,comments`
                to read the full thread. Find your most recent plan comment.
              - Read the specific comment via `gh api /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}`
                to see the feedback verbatim.

            Step 2 — post a follow-up comment on the issue that either:
              - Restates the full revised plan reflecting the feedback, or
              - Asks a targeted clarifying question if the request is ambiguous.

            End the comment with: "Comment `/implement` to approve and have me open a PR."

            Rules:
              - Do NOT open a PR, push a branch, or modify any files. Comment only.
              - Do NOT modify `.github/workflows/*`.
          claude_args: --model opus --max-turns 100 --allowedTools "Read,Glob,Grep,LS,Bash(gh:*)"
      - name: Mark issue claude-plan-needs-review
        if: success()
        uses: ./.github/actions/set-claude-label
        with:
          issue: ${{ github.event.issue.number }}
          label: claude-plan-needs-review
          github-token: ${{ secrets.GITHUB_TOKEN }}

  implement:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/implement') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: dev
      - name: Configure git
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"
      - name: Create branch
        run: git checkout -b "claude/issue-${{ github.event.issue.number }}"
      - name: Mark issue claude-implementing
        uses: ./.github/actions/set-claude-label
        with:
          issue: ${{ github.event.issue.number }}
          label: claude-implementing
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implement issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            A collaborator has approved with `/implement`.

            You are checked out on branch `claude/issue-${{ github.event.issue.number }}`
            based on `dev`. Your job is to implement, commit, push, and open a PR.

            Step 1 — read the approved plan:
              - Read `CLAUDE.md`.
              - Run `gh issue view ${{ github.event.issue.number }} --json title,body,comments`.
              - Find the most recent plan comment you authored. That is the approved plan.
              - Read any files the plan references.

            Step 2 — implement:
              - Make the changes on the current branch.
              - Run `cd dali-api && npm install && npm run typecheck` before committing. Fix any type errors.
              - Commit with a clear message referencing the issue.
              - Push the branch: `git push -u origin claude/issue-${{ github.event.issue.number }}`.

            Step 3 — open the PR:
              - Target base branch: `dev`.
              - Title: `Fix #${{ github.event.issue.number }}: <short description>`.
              - Body must include `Closes #${{ github.event.issue.number }}` and a link back to your plan comment.
              - Do NOT add labels to the PR. Issue-level state labels are managed by the workflow.

            Rules:
              - Do NOT modify `.github/workflows/*`.
              - Do NOT use `--no-verify` or any hook-bypass flag.
              - Do NOT force-push `dev`, `prod`, `staging`, or `main`.
              - If the plan is genuinely ambiguous or mid-implementation you hit
                a real tradeoff, STOP. Do NOT open a PR. Instead comment on
                issue #${{ github.event.issue.number }} explaining what's
                blocking you and what options you considered.
          claude_args: --model opus --max-turns 100 --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*)"
      - name: Determine implement outcome
        id: outcome
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          PR_COUNT=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "claude/issue-$ISSUE" \
            --state open \
            --json number --jq 'length')
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "label=claude-pr-needs-review" >> "$GITHUB_OUTPUT"
          else
            # Claude exited cleanly without opening a PR (escape-hatch handoff).
            # Treat as failure so a human knows to look.
            echo "label=claude-failed" >> "$GITHUB_OUTPUT"
          fi
      - name: Mark issue per implement outcome
        if: success()
        uses: ./.github/actions/set-claude-label
        with:
          issue: ${{ github.event.issue.number }}
          label: ${{ steps.outcome.outputs.label }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Mark issue claude-failed (any prior step failed)
        if: failure()
        uses: ./.github/actions/set-claude-label
        with:
          issue: ${{ github.event.issue.number }}
          label: claude-failed
          github-token: ${{ secrets.GITHUB_TOKEN }}

  respond_review:
    if: >
      (
        (github.event_name == 'pull_request_review' && github.event.action == 'submitted') ||
        (github.event_name == 'pull_request_review_comment' && github.event.action == 'created')
      ) &&
      startsWith(github.event.pull_request.head.ref, 'claude/issue-') &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token (so pushes trigger downstream workflows)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROMOTE_APP_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Configure git
        run: |
          git config --global user.email "claude[bot]@users.noreply.github.com"
          git config --global user.name "claude[bot]"

      - name: Convert PR to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          gh api graphql \
            -f query='mutation($id: ID!) { convertPullRequestToDraft(input: {pullRequestId: $id}) { pullRequest { isDraft } } }' \
            -F id="$PR_NODE_ID" >/dev/null

      - name: Mark issue claude-implementing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Issue number is encoded in the head ref `claude/issue-N`. Inline
          # the label-set logic so it doesn't depend on the composite action
          # being on the PR's branch.
          ISSUE="${HEAD_REF#claude/issue-}"
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse issue number from branch '$HEAD_REF'"
            exit 1
          fi
          gh label create claude-implementing \
            --repo "$GITHUB_REPOSITORY" \
            --color "1D76DB" \
            --description "Claude is actively implementing" 2>/dev/null || true
          for L in claude claude-plan-needs-review claude-pr-needs-review claude-failed; do
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "$L" 2>/dev/null || true
          done
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label claude-implementing
          echo "ISSUE_NUMBER=$ISSUE" >> "$GITHUB_ENV"

      - name: Post working comment
        id: working
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.event.sender.login }}
        run: |
          BODY=$(printf '<!-- claude-respond-review -->\n🤖 Working on changes for the latest review feedback from @%s…' "$REVIEWER")
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -f body="$BODY" --jq '.id')
          echo "comment_id=$ID" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A reviewer (@${{ github.event.sender.login }}) left feedback on
            PR #${{ github.event.pull_request.number }} in ${{ github.repository }}
            (branch `${{ github.event.pull_request.head.ref }}`).

            Event: ${{ github.event_name }}

            The workflow has already:
              - Converted the PR to draft.
              - Set the linked issue to `claude-implementing`.
              - Posted a placeholder PR comment (id `${{ steps.working.outputs.comment_id }}`)
                with body "Working on changes…". You will EDIT that comment at the end
                instead of posting a new summary comment.

            Step 1 — read context:
              - Read `CLAUDE.md`.
              - `gh pr view ${{ github.event.pull_request.number }} --json title,body,headRefName,baseRefName`.
              - `gh pr diff ${{ github.event.pull_request.number }}`.
              - Fetch the review / review comment itself:
                - If pull_request_review: `gh api /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/${{ github.event.review.id }}`.
                - If pull_request_review_comment: `gh api /repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.id }}`.
              - Also fetch all review comments on the PR so you see any inline threads:
                `gh api /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`.

            Step 2 — respond. For each distinct review point, choose ONE:
              (a) Make the requested change. Run `cd dali-api && npm run typecheck` if you touched TS files. Commit. Push.
              (b) Note in the final summary why you didn't change it: either the feedback is
                  ambiguous, forces a real tradeoff, or you disagree for a principled reason.
                  Do NOT push a guess.

            Step 3 — finish by EDITING the placeholder comment to be your summary.
              Run:
                gh api -X PATCH /repos/${{ github.repository }}/issues/comments/${{ steps.working.outputs.comment_id }} \
                  -f body="<!-- claude-respond-review -->
            ✅ Done.

            <bulleted summary: for each review point, one line on what you changed (or why you didn't)>
            "
              Keep the leading sentinel comment so the workflow can find this comment later.
              Do NOT post a new summary comment — only edit the existing one.

            Rules:
              - Do NOT mark conversations resolved.
              - Do NOT force-push unless rebasing on `dev` is genuinely necessary; if so, explain in the summary.
              - Do NOT modify `.github/workflows/*`.
              - Do NOT use `--no-verify`.
              - Do NOT mark the PR ready for review yourself; the workflow does that after you finish.
          claude_args: --model sonnet --max-turns 100 --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*)"

      - name: Mark PR ready for review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          gh api graphql \
            -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { isDraft } } }' \
            -F id="$PR_NODE_ID" >/dev/null

      - name: Mark issue claude-pr-needs-review (success)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create claude-pr-needs-review \
            --repo "$GITHUB_REPOSITORY" \
            --color "0E8A16" \
            --description "Claude opened a PR; awaiting reviewer" 2>/dev/null || true
          for L in claude claude-plan-needs-review claude-implementing claude-failed; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$L" 2>/dev/null || true
          done
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label claude-pr-needs-review

      - name: Mark issue claude-failed and patch comment (failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ steps.working.outputs.comment_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create claude-failed \
            --repo "$GITHUB_REPOSITORY" \
            --color "B60205" \
            --description "Claude implementation or CI auto-fix failed" 2>/dev/null || true
          for L in claude claude-plan-needs-review claude-implementing claude-pr-needs-review; do
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$L" 2>/dev/null || true
          done
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label claude-failed
          if [ -n "$COMMENT_ID" ]; then
            BODY=$(printf '<!-- claude-respond-review -->\n❌ Did not finish responding to the review. See [workflow run](%s) for details.' "$RUN_URL")
            gh api -X PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY" >/dev/null || true
          fi
