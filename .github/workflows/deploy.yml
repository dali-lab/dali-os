name: Deploy to Fly.io

on:
  push:
    branches:
      - dev
      - prod

jobs:
  deploy-api:
    name: Deploy dali-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dali-api
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to dev
        if: github.ref == 'refs/heads/dev'
        run: flyctl deploy --config fly.dev.toml --app dali-api-dev --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy to prod
        if: github.ref == 'refs/heads/prod'
        run: flyctl deploy --config fly.prod.toml --app dali-api-prod --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    name: Deploy dali-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dali-web
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to dev
        if: github.ref == 'refs/heads/dev'
        run: flyctl deploy --config fly.dev.toml --app dali-web-dev --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy to prod
        if: github.ref == 'refs/heads/prod'
        run: flyctl deploy --config fly.prod.toml --app dali-web-prod --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
