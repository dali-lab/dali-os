name: Promote to prod

# Fast-forward push of `staging` onto `prod` when a write-access user leaves
# a `/push` comment on a staging → prod PR. The PR exists for CI visibility; the
# actual promotion happens here, not via the GitHub merge button (which is
# blocked by branch-protection push restrictions on `prod`).
#
# The staging head must have green required checks (test-api, integration-api,
# e2e-api, Build API; a job skipped by the changed-paths filter counts as
# passing). An admin can bypass with `/push --force`; the bypass is logged on the PR.
#
# Setup: PROMOTE_APP_ID + PROMOTE_APP_PRIVATE_KEY secrets, App installed on
# this repo, App listed as bypass actor on the `prod` ruleset.

on:
  issue_comment:
    types: [created]

jobs:
  check:
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/push')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
      checks: read
    outputs:
      head_sha: ${{ steps.context.outputs.head_sha }}
    steps:
      - name: Read PR context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh api "repos/$OWNER/$REPO/pulls/$PR")
          BASE=$(jq -r '.base.ref' <<<"$PR_JSON")
          HEAD=$(jq -r '.head.ref' <<<"$PR_JSON")
          HEAD_SHA=$(jq -r '.head.sha' <<<"$PR_JSON")
          echo "base=$BASE" >>"$GITHUB_OUTPUT"
          echo "head=$HEAD" >>"$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >>"$GITHUB_OUTPUT"

      - name: Verify base=prod head=staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.issue.number }}
          BASE: ${{ steps.context.outputs.base }}
          HEAD: ${{ steps.context.outputs.head }}
        run: |
          if [ "$BASE" != "prod" ] || [ "$HEAD" != "staging" ]; then
            gh pr comment "$PR" --repo "$OWNER/$REPO" --body "❌ \`/push\` here would promote \`$HEAD\` → \`$BASE\`. This workflow only handles \`staging\` → \`prod\`."
            exit 1
          fi

      - name: Verify commenter has write access
        id: perm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.issue.number }}
          USER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          PERM=$(gh api "repos/$OWNER/$REPO/collaborators/$USER/permission" --jq '.permission' 2>/dev/null || echo "none")
          case "$PERM" in
            admin|write|maintain) echo "$USER has $PERM access" ;;
            *)
              gh pr comment "$PR" --repo "$OWNER/$REPO" --body "❌ \`/push\` from @$USER ignored — write access required (got: \`$PERM\`)."
              exit 1
              ;;
          esac
          echo "perm=$PERM" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Require green checks on the staging head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.issue.number }}
          USER: ${{ github.event.comment.user.login }}
          PERM: ${{ steps.perm.outputs.perm }}
          COMMENT: ${{ github.event.comment.body }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          set -uo pipefail
          gh api --paginate "repos/$OWNER/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[]' >"$RUNNER_TEMP/check-runs.ndjson"
          if node .github/scripts/require-green.mjs "$HEAD_SHA" "$RUNNER_TEMP/check-runs.ndjson" >"$RUNNER_TEMP/report.md"; then
            cat "$RUNNER_TEMP/report.md"
            exit 0
          fi
          FORCE=false
          if [ "$(awk '{print $2}' <<<"$COMMENT" | head -n1)" = "--force" ]; then FORCE=true; fi
          if [ "$FORCE" = true ] && [ "$PERM" = "admin" ]; then
            MSG=$(printf '⚠️ @%s (admin) forced `/push` past failing checks.\n\n%s' "$USER" "$(cat "$RUNNER_TEMP/report.md")")
            echo "$MSG" >>"$GITHUB_STEP_SUMMARY"
            gh pr comment "$PR" --repo "$OWNER/$REPO" --body "$MSG"
            exit 0
          fi
          HINT="Fix or re-run the failing checks, then comment \`/push\` again. An admin can override with \`/push --force\`."
          if [ "$FORCE" = true ]; then HINT="\`--force\` needs admin permission (got: \`$PERM\`)."; fi
          MSG=$(printf '❌ Not promoting. %s\n\n%s' "$(cat "$RUNNER_TEMP/report.md")" "$HINT")
          echo "$MSG" >>"$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$OWNER/$REPO" --body "$MSG"
          exit 1

  promote:
    needs: check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Mint installation token from PROMOTE App
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROMOTE_APP_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}

      - name: Checkout with App token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify fast-forward feasibility
        env:
          HEAD_SHA: ${{ needs.check.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin prod staging
          if ! git merge-base --is-ancestor origin/prod "$HEAD_SHA"; then
            echo "::error::prod is not an ancestor of $HEAD_SHA — fast-forward not possible. Did someone push to prod directly, or did staging get rebased?"
            exit 1
          fi

      - name: Fast-forward push prod
        env:
          HEAD_SHA: ${{ needs.check.outputs.head_sha }}
        run: git push origin "$HEAD_SHA:refs/heads/prod"

      - name: Comment + close PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.check.outputs.head_sha }}
        run: |
          gh pr comment "$PR" --body "✅ Fast-forwarded \`prod\` to \`$HEAD_SHA\`."
          gh pr close "$PR"
