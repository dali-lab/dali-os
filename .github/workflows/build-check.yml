name: Build Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml

  build-api:
    name: Build API
    needs: changes
    # A preview deploy builds the same image, so skip the duplicate build.
    if: needs.changes.outputs.api == 'true' && !contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.5.8
      - run: cd dali-api && flyctl deploy --build-only --config fly.staging.toml -a dali-api-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
