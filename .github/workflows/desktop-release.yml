# Builds, signs, notarizes, and publishes the macOS desktop shell — separate from
# the web app's CI/deploy. It auto-releases when desktop/src-tauri/tauri.conf.json's
# version changes on `dev` (a version-bump merge IS the release), and also accepts
# a manual `desktop-v*` tag or a workflow_dispatch as a fallback. Re-runs for an
# already-released version are skipped (idempotent).
#
# REQUIRES secrets the repo owner must provision (the build can't create them):
#   Apple (Gatekeeper):  APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#                        APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Tauri updater:       TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#                        (the matching PUBLIC key goes in desktop/src-tauri/tauri.conf.json)
#   S3 publish:          DESKTOP_AWS_ACCESS_KEY_ID, DESKTOP_AWS_SECRET_ACCESS_KEY
# Publishes to the dedicated public bucket s3://dali-os-desktop-releases (NOT the
# private uploads bucket). See ../../TAURI_DESKTOP_PLAN.md and ../../desktop/README.md.

name: Desktop Release (macOS)

on:
  push:
    branches: [dev]
    paths:
      - "desktop/src-tauri/tauri.conf.json"
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write # needed to push the release tag

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # Decide the version + whether there's actually a new release to cut. On a
  # `desktop-v*` tag the version comes from the tag; otherwise from tauri.conf.json,
  # and we skip if that version was already released (its tag exists).
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
            if git ls-remote --exit-code --tags origin "refs/tags/desktop-v${VERSION}" >/dev/null 2>&1; then
              echo "desktop-v${VERSION} already released — skipping."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "New version ${VERSION} — releasing."
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: decide
    if: ${{ needs.decide.outputs.release == 'true' }}
    runs-on: macos-14 # Apple silicon
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Export Apple signing creds to the job env ONLY when a cert secret is
      # actually set. GitHub injects an empty string for an unset secret, and
      # Tauri's bundler treats "present-but-empty" APPLE_CERTIFICATE as "sign",
      # then fails importing an empty cert. Gating here means: no Apple secrets →
      # clean UNSIGNED build; once the APPLE_* secrets exist → signing +
      # notarization turn on automatically with no workflow edit.
      - name: Configure Apple signing (only when a cert is present)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Apple cert present — release will be signed + notarized."
            {
              echo "APPLE_CERTIFICATE<<__CERT__"; echo "$APPLE_CERTIFICATE"; echo "__CERT__"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No APPLE_CERTIFICATE secret — building UNSIGNED (Gatekeeper will warn on launch)."
          fi

      # tauri-action builds → (Developer ID sign + notarytool + staple when the
      # Apple env above was exported) → emits the updater .app.tar.gz + .sig
      # (signed with the minisign key, which is always present).
      - name: Build (sign + notarize when Apple creds present)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Compose latest.json + publish to S3
        working-directory: desktop
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          S3="s3://dali-os-desktop-releases"
          PUBLIC_BASE="https://dali-os-desktop-releases.s3.us-east-1.amazonaws.com/releases/${VERSION}"

          TARGZ="$(ls "${BUNDLE}"/macos/*.app.tar.gz | head -n1)"
          DMG="$(ls "${BUNDLE}"/dmg/*.dmg | head -n1)"
          SIG="$(cat "${TARGZ}.sig")"

          aws s3 cp "${TARGZ}" "${S3}/releases/${VERSION}/"
          aws s3 cp "${DMG}"   "${S3}/releases/${VERSION}/"
          # Stable, version-less copy the website's /download page links to, so
          # that page never depends on the version/filename. Overwritten each release.
          aws s3 cp "${DMG}" "${S3}/DALI-OS-macos.dmg" --content-type application/x-apple-diskimage

          # Universal build: both arch keys point at the one universal artifact.
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "DALI OS desktop ${VERSION}",
            "platforms": {
              "darwin-aarch64": { "signature": "${SIG}", "url": "${PUBLIC_BASE}/$(basename "${TARGZ}")" },
              "darwin-x86_64":  { "signature": "${SIG}", "url": "${PUBLIC_BASE}/$(basename "${TARGZ}")" }
            }
          }
          EOF

          aws s3 cp latest.json "${S3}/latest.json"

      # Record the release as a tag (only when we weren't already triggered by one).
      # Pushed with GITHUB_TOKEN, which intentionally does NOT re-trigger this
      # workflow — so no release loop. The tag is what makes future re-runs idempotent.
      - name: Tag the release
        if: ${{ github.ref_type != 'tag' }}
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          git tag "desktop-v${VERSION}"
          git push origin "desktop-v${VERSION}"
