# Builds, signs, notarizes (macOS), and publishes the desktop shell for macOS and
# Linux — separate from the web app's CI/deploy. It auto-releases when
# desktop/src-tauri/tauri.conf.json's version changes on `dev` (a version-bump
# merge IS the release), and also accepts a manual `desktop-v*` tag or a
# workflow_dispatch as a fallback. Re-runs for an already-released version are
# skipped (idempotent).
#
# REQUIRES secrets the repo owner must provision (the build can't create them):
#   Apple (Gatekeeper):  APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#                        APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Tauri updater:       TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#                        (the matching PUBLIC key goes in desktop/src-tauri/tauri.conf.json)
#   S3 publish:          DESKTOP_AWS_ACCESS_KEY_ID, DESKTOP_AWS_SECRET_ACCESS_KEY
# Publishes to the dedicated public bucket s3://dali-os-desktop-releases (NOT the
# private uploads bucket). See ../../TAURI_DESKTOP_PLAN.md and ../../desktop/README.md.

name: Desktop Release (macOS + Linux)

on:
  push:
    branches: [dev]
    paths:
      - "desktop/src-tauri/tauri.conf.json"
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write # needed to push the release tag

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # Decide the version + whether there's actually a new release to cut. On a
  # `desktop-v*` tag the version comes from the tag; otherwise from tauri.conf.json,
  # and we skip if that version was already released (its tag exists).
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(jq -r .version desktop/src-tauri/tauri.conf.json)"
            if git ls-remote --exit-code --tags origin "refs/tags/desktop-v${VERSION}" >/dev/null 2>&1; then
              echo "desktop-v${VERSION} already released — skipping."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "New version ${VERSION} — releasing."
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: decide
    if: ${{ needs.decide.outputs.release == 'true' }}
    runs-on: macos-14 # Apple silicon
    outputs:
      mac_url: ${{ steps.upload.outputs.mac_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Export Apple signing creds to the job env ONLY when a cert secret is
      # actually set. GitHub injects an empty string for an unset secret, and
      # Tauri's bundler treats "present-but-empty" APPLE_CERTIFICATE as "sign",
      # then fails importing an empty cert. Gating here means: no Apple secrets →
      # clean UNSIGNED build; once the APPLE_* secrets exist → signing +
      # notarization turn on automatically with no workflow edit.
      - name: Configure Apple signing (only when a cert is present)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Apple cert present — release will be signed + notarized."
            {
              echo "APPLE_CERTIFICATE<<__CERT__"; echo "$APPLE_CERTIFICATE"; echo "__CERT__"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No APPLE_CERTIFICATE secret — building UNSIGNED (Gatekeeper will warn on launch)."
          fi

      # tauri-action builds → (Developer ID sign + notarytool + staple when the
      # Apple env above was exported) → emits the updater .app.tar.gz + .sig
      # (signed with the minisign key, which is always present).
      - name: Build (sign + notarize when Apple creds present)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --target universal-apple-darwin --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload versioned artifacts to S3
        id: upload
        working-directory: desktop
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          S3="s3://dali-os-desktop-releases"
          PUBLIC_BASE="https://dali-os-desktop-releases.s3.us-east-1.amazonaws.com/releases/${VERSION}"

          TARGZ="$(ls "${BUNDLE}"/macos/*.app.tar.gz | head -n1)"
          DMG="$(ls "${BUNDLE}"/dmg/*.dmg | head -n1)"

          aws s3 cp "${TARGZ}" "${S3}/releases/${VERSION}/"
          aws s3 cp "${DMG}"   "${S3}/releases/${VERSION}/"
          # Stable, version-less copy the website's /download page links to.
          aws s3 cp "${DMG}" "${S3}/DALI-OS-macos.dmg" --content-type application/x-apple-diskimage

          echo "mac_url=${PUBLIC_BASE}/$(basename "${TARGZ}")" >> "$GITHUB_OUTPUT"

      - name: Save sig for publish job
        uses: actions/upload-artifact@v4
        with:
          name: macos-sig
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-linux:
    needs: decide
    if: ${{ needs.decide.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      linux_url: ${{ steps.upload.outputs.linux_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Build AppImage
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload versioned artifacts to S3
        id: upload
        working-directory: desktop
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          S3="s3://dali-os-desktop-releases"
          PUBLIC_BASE="https://dali-os-desktop-releases.s3.us-east-1.amazonaws.com/releases/${VERSION}"

          TARGZ="$(ls "${BUNDLE}"/appimage/*.AppImage.tar.gz | head -n1)"
          APPIMAGE="$(ls "${BUNDLE}"/appimage/*.AppImage | grep -v '\.tar\.gz' | head -n1)"

          aws s3 cp "${TARGZ}"     "${S3}/releases/${VERSION}/"
          aws s3 cp "${APPIMAGE}"  "${S3}/releases/${VERSION}/"
          # Stable, version-less copy the website's /download page links to.
          aws s3 cp "${APPIMAGE}"  "${S3}/DALI-OS-linux.AppImage"

          echo "linux_url=${PUBLIC_BASE}/$(basename "${TARGZ}")" >> "$GITHUB_OUTPUT"

      - name: Save sig for publish job
        uses: actions/upload-artifact@v4
        with:
          name: linux-sig
          path: desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig

  build-windows:
    needs: decide
    if: ${{ needs.decide.outputs.release == 'true' }}
    runs-on: windows-latest
    outputs:
      windows_url: ${{ steps.upload.outputs.windows_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      # Unsigned build — SmartScreen will warn on first run ("Unknown publisher").
      # To add code signing later, provision WINDOWS_CERTIFICATE +
      # WINDOWS_CERTIFICATE_PASSWORD secrets and set them in env here.
      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload versioned artifacts to S3
        id: upload
        working-directory: desktop
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          S3="s3://dali-os-desktop-releases"
          PUBLIC_BASE="https://dali-os-desktop-releases.s3.us-east-1.amazonaws.com/releases/${VERSION}"

          TARGZ="$(ls "${BUNDLE}"/nsis/*.nsis.zip | head -n1)"
          EXE="$(ls "${BUNDLE}"/nsis/*-setup.exe | head -n1)"

          aws s3 cp "${TARGZ}" "${S3}/releases/${VERSION}/"
          aws s3 cp "${EXE}"   "${S3}/releases/${VERSION}/"
          # Stable, version-less copy the website's /download page links to.
          aws s3 cp "${EXE}" "${S3}/DALI-OS-windows.exe"

          echo "windows_url=${PUBLIC_BASE}/$(basename "${TARGZ}")" >> "$GITHUB_OUTPUT"

      - name: Save sig for publish job
        uses: actions/upload-artifact@v4
        with:
          name: windows-sig
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip.sig

  # Merge all platform artifacts into latest.json and tag the release. Runs only
  # after all three builds succeed so the feed is never partially updated.
  publish:
    needs: [decide, build-macos, build-linux, build-windows]
    if: ${{ needs.decide.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-sig
          path: sigs/mac

      - uses: actions/download-artifact@v4
        with:
          name: linux-sig
          path: sigs/linux

      - uses: actions/download-artifact@v4
        with:
          name: windows-sig
          path: sigs/windows

      - name: Compose latest.json and publish to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DESKTOP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          VERSION: ${{ needs.decide.outputs.version }}
          MAC_URL: ${{ needs.build-macos.outputs.mac_url }}
          LINUX_URL: ${{ needs.build-linux.outputs.linux_url }}
          WINDOWS_URL: ${{ needs.build-windows.outputs.windows_url }}
        run: |
          set -euo pipefail
          MAC_SIG="$(cat sigs/mac/*.sig)"
          LINUX_SIG="$(cat sigs/linux/*.sig)"
          WINDOWS_SIG="$(cat sigs/windows/*.sig)"

          # Universal build: both Darwin arch keys share the one universal artifact.
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "DALI OS desktop ${VERSION}",
            "platforms": {
              "darwin-aarch64": { "signature": "${MAC_SIG}", "url": "${MAC_URL}" },
              "darwin-x86_64":  { "signature": "${MAC_SIG}", "url": "${MAC_URL}" },
              "linux-x86_64":   { "signature": "${LINUX_SIG}", "url": "${LINUX_URL}" },
              "windows-x86_64": { "signature": "${WINDOWS_SIG}", "url": "${WINDOWS_URL}" }
            }
          }
          EOF

          aws s3 cp latest.json "s3://dali-os-desktop-releases/latest.json"

      # Record the release as a tag (only when we weren't already triggered by one).
      # Pushed with GITHUB_TOKEN, which intentionally does NOT re-trigger this
      # workflow — so no release loop. The tag is what makes future re-runs idempotent.
      - name: Tag the release
        if: ${{ github.ref_type != 'tag' }}
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          git tag "desktop-v${VERSION}"
          git push origin "desktop-v${VERSION}"
