name: Deploy dali-asr

on:
  push:
    branches:
      - staging
      - prod
    paths:
      - "asr/**"

# Serialize deploys per branch/environment, same reasoning as deploy.yml:
# a cancelled `modal deploy` mid-flight can leave the app half-updated.
concurrency:
  group: deploy-asr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-asr:
    name: Deploy dali-asr (${{ github.ref_name }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: asr
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --no-dev
      - run: uv run modal deploy modal_app.py --env ${{ github.ref_name }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
