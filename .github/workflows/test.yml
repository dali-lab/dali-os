name: Test dali-api

on:
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dali-api
    env:
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
