name: Test dali-api

on:
  push:
    branches: [prod]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/changed-paths.yml

  test-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: dali-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dali-api/package-lock.json
      - run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Write coverage summary
        if: always()
        continue-on-error: true
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: dali-api/coverage/
          retention-days: 7

  integration-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: dali-api
    env:
      DATABASE_URL: postgresql://dali:dali@localhost:5432/dali_integration
      DIRECT_URL: postgresql://dali:dali@localhost:5432/dali_integration
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dali
          POSTGRES_PASSWORD: dali
          POSTGRES_DB: dali_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dali-api/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run integration tests
        run: npm run test:integration

  e2e-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: dali-api
    env:
      DATABASE_URL: postgresql://dali:dali@localhost:5432/dali
      CAS_BASE_URL: https://login.dartmouth.edu/cas
      FRONTEND_URL: http://localhost:5173
      API_BASE_URL: http://localhost:3001
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dali
          POSTGRES_PASSWORD: dali
          POSTGRES_DB: dali
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dali-api/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run migrations and seed
        run: npx prisma migrate reset --force && npx prisma db seed
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: npm run build
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dali-api/e2e/test-results/
            dali-api/playwright-report/
          retention-days: 7

  typecheck-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    continue-on-error: true
    defaults:
      run:
        working-directory: dali-api
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dali-api/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        shell: bash
        run: |
          npm run typecheck 2>&1 | tee tsc.log
          status=${PIPESTATUS[0]}
          count=$(grep -c 'error TS' tsc.log || true)
          echo "tsc errors: $count" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  test-asr:
    needs: changes
    if: needs.changes.outputs.asr == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: asr
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest
