app = "dali-web-dev"
primary_region = "iad"

[build]
  # Public per-env URLs inlined into the client bundle by Vite at build time.
  # VITE_GOOGLE_CLIENT_ID is also a build arg, but sourced from GitHub Actions
  # secrets via --build-arg in .github/workflows/deploy.yml so it stays out of
  # the repo.
  [build.args]
    VITE_DALI_DB_URL = "https://dali-api-dev.fly.dev"
    VITE_FRONTEND_URL = "https://dali-web-dev.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
