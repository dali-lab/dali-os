[project]
name = "dali-asr"
version = "0.1.0"
description = "Modal app for batch meeting transcription and speaker diarization (DALI OS)"
requires-python = ">=3.12"
# Only what the deploy and bench entry points import on the laptop/CI side.
# Model dependencies (torch, onnx-asr, pyannote) are installed inside the
# Modal image by modal_app.py and never locally.
dependencies = [
    "modal>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "numpy>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
