app = "dali-api-prod"
primary_region = "iad"

[deploy]
  release_command = "npx prisma migrate deploy"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
