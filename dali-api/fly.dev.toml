app = "dali-api-dev"
primary_region = "iad"

[deploy]
  # Retry migrate deploy up to 4× with linear backoff to absorb Neon
  # cold-start latency that intermittently blows Prisma's hardcoded
  # 10s pg_advisory_lock timeout (P1002). Issue #101.
  release_command = "sh -c 'n=0; until npx prisma migrate deploy; do n=$((n+1)); [ $n -ge 4 ] && exit 1; sleep $n; done; npx prisma db seed'"

[env]
  NODE_ENV = "development"
  # Where the browser opens the Hocuspocus WebSocket. Must match the
  # [[services]] block below; CSP also derives connect-src from this.
  COLLAB_URL = "wss://os-dev.dali.dartmouth.edu:3002"

[build.args]
  OMIT_DEV = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# Hocuspocus collab server. See fly.prod.toml for the regression history.
[[services]]
  internal_port = 3002
  protocol = "tcp"

  [[services.ports]]
    port = 3002
    handlers = ["tls"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
