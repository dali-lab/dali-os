<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DALI OS</title>
    <link rel="stylesheet" href="pairing.css" />
    <link rel="stylesheet" href="tray.css" />
  </head>
  <body>
    <main id="card" class="card" role="dialog" aria-label="DALI OS">
      <section class="now">
        <p id="now-label" class="now-label"></p>
        <button id="now-open" class="now-title" type="button"></button>
        <p class="now-sub">
          <span id="now-sub"></span>
          <button id="now-call" class="now-call hidden" type="button"></button>
        </p>
        <div id="now-actions" class="now-actions hidden">
          <button id="btn-primary" class="btn btn-primary hidden" type="button"></button>
          <button id="btn-record" class="btn btn-secondary hidden" type="button"><i class="rec-dot" aria-hidden="true"></i>Record</button>
          <button id="btn-notes" class="btn btn-secondary hidden" type="button">Open notes</button>
        </div>
      </section>

      <section id="later" class="later hidden"></section>

      <footer class="footer">
        <button id="btn-open" class="open" type="button">Open DALI OS</button>
        <span id="offline" class="offline hidden"><i aria-hidden="true"></i>Offline</span>
        <div class="footer-actions">
          <button id="btn-notifications" class="icon-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10.268 21a2 2 0 0 0 3.464 0" />
              <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
            </svg>
            <span id="badge" class="badge hidden" aria-hidden="true"></span>
          </button>
          <button id="btn-settings" class="icon-btn" type="button" title="Notification settings" aria-label="Notification settings">
            <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.8a7.7 7.7 0 0 0-1.7-1l-.3-2.4h-4l-.3 2.4a7.7 7.7 0 0 0-1.7 1l-2.3-.8-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.8a7.7 7.7 0 0 0 1.7 1l.3 2.4h4l.3-2.4a7.7 7.7 0 0 0 1.7-1l2.3.8 2-3.4Z" />
            </svg>
          </button>
        </div>
      </footer>
    </main>
    <script src="tray.js"></script>
  </body>
</html>
