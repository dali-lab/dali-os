<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting detected</title>
    <link rel="stylesheet" href="pairing.css" />
    <link rel="stylesheet" href="record-prompt.css" />
  </head>
  <body>
    <main class="panel" role="alertdialog" aria-label="Meeting detected">
      <button id="btn-close" class="icon-btn" aria-label="Dismiss" title="Dismiss">&times;</button>

      <section class="content">
        <div class="eyebrow">Meeting detected</div>
        <div id="subtitle" class="subtitle">Checking the meeting…</div>

        <div class="actions">
          <button id="btn-start" class="primary">Start recording</button>
          <button id="btn-chevron" class="icon-btn chevron" aria-haspopup="true" aria-expanded="false" aria-label="More options">
            &#9662;
          </button>
        </div>

        <p class="footer">By starting, you confirm everyone in the meeting knows it's being recorded.</p>
      </section>

      <!-- Covers the panel's content area while open — a separate OS window
           can't float a popover past this window's fixed bounds, so the menu
           has to live inside them instead of overflowing below the chevron. -->
      <section id="menu" class="menu hidden" role="menu">
        <button id="menu-back" class="icon-btn" aria-label="Back" title="Back">&larr;</button>
        <button id="menu-open" class="menu-item" role="menuitem">Open the note instead</button>
        <button id="menu-mute" class="menu-item" role="menuitem">Don't suggest for this meeting</button>
      </section>
    </main>
    <script src="record-prompt.js"></script>
  </body>
</html>
